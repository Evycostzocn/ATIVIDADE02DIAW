<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<main class="container">
    <section class="card cadastro-card">
        <div class="branding">
            <img
                th:src="@{/images/PUC_Brasao.jpg}"
                alt="Brasão PUC Minas"
                class="brasao">
        </div>

        <div class="form-container cadastro">
            <h1>Cadastro</h1>
            <form th:action="@{/register}" method="post" th:object="${registerForm}">
                <div class="message error" th:if="${#fields.hasAnyErrors()}" role="alert">
                    <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
                </div>
                <div class="input-group"><label for="nome">Nome completo</label><input type="text" th:field="*{nome}" maxlength="100" autocomplete="name" required></div>
                <div class="input-group"><label for="email">Email</label><input type="email" th:field="*{email}" maxlength="254" autocomplete="username" required></div>
                <div class="input-group"><label for="cpf">CPF</label><input type="text" th:field="*{cpf}" maxlength="20" required></div>
                <div class="input-group"><label for="rg">RG</label><input type="text" th:field="*{rg}" maxlength="30" required></div>
                <div class="input-group"><label for="endereco">Endereço</label><input type="text" th:field="*{endereco}" maxlength="200" required></div>
                <div class="input-group"><label for="instituicao">Instituição</label><input type="text" th:field="*{instituicao}" maxlength="150" required></div>
                <div class="input-group"><label for="senha">Senha</label><input type="password" id="senha" name="senha" minlength="8" maxlength="64" autocomplete="new-password" required></div>
                <div class="input-group"><label for="confirmacaoSenha">Confirme a senha</label><input type="password" id="confirmacaoSenha" name="confirmacaoSenha" minlength="8" maxlength="64" autocomplete="new-password" required></div>
                <p>A senha deve ter de 8 a 64 caracteres.</p>
                <button type="submit" class="btn">Cadastrar</button>
            </form>

            <div class="switch-form cadastro-switch">
                <span>Já possui conta?</span>
                <a th:href="@{/login}">
                    Faça login
                </a>

            </div>
        </div>
    </section>
</main>
</body>
</html>
