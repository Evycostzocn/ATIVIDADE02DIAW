<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet"
          th:href="@{/css/login.css}">
</head>

<body>
<main class="container">
    <section class="card">
        <div class="branding">
            <img th:src="@{/images/PUC_Brasao.jpg}" alt="Brasão PUC Minas" class="brasao">
        </div>

        <div class="form-container">
            <h1>Recuperar senha</h1>
            <p>O envio de email é um recurso opcional e não está disponível nesta versão.</p>
            <p class="message error" th:if="${erro}" th:text="${erro}" role="alert"></p>
            <p class="message success" th:if="${mensagem}" th:text="${mensagem}" role="status"></p>
            <form th:action="@{/recoverpassword}" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
                </div>
                <button type="submit" class="btn">Solicitar recuperação</button>
            </form>
            <div class="switch-form"><a th:href="@{/login}">Voltar ao login</a></div>
            
        </div>
    </section>
</main>
</body>
</html>
