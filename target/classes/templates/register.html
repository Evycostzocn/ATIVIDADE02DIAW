<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<main class="container">
    <section class="card cadastro-card">
        <div class="branding">
            <img
                th:src="@{/images/PUC_Brasao.jpg}"
                alt="Brasão PUC Minas"
                class="brasao">
        </div>

        <div class="form-container cadastro">
            <h1>Cadastro</h1>
            <form>
                <div class="input-group">
                    <input type="text" id="nome" name="nome" placeholder="Nome Completo" required>
                </div>

                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                </div>

                <div class="input-group">
                    <input type="text" id="rg" name="rg" placeholder="RG" required>
                </div>

                <div class="input-group">
                    <input type="text" id="endereco" name="endereco" placeholder="Endereço" required>
                </div>

                <div class="input-group">
                    <input type="text" id="instituicao" name="instituicao" placeholder="Instituição" required>
                </div>

                <div class="input-group">
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                </div>

                <button type="submit" class="btn">
                    Se registrar
                </button>
            </form>

            <div class="switch-form cadastro-switch">
                <span>Já possui conta?</span>
                <a th:href="@{/login}">
                    Faça login
                </a>

            </div>
        </div>
    </section>
</main>
</body>
</html>
